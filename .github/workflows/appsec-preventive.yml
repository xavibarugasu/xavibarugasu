name: AppSec preventive check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

concurrency:
  group: appsec-preventive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preventive-scan:
    name: Safe static indicators and skill validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check skill files
        run: |
          test -s .claude/skills/appsec-security-auditor/SKILL.md
          test -s .claude/skills/appsec-security-auditor/references/controles-20.md
          test -s .claude/skills/appsec-security-auditor/references/plantilla-informe.md
      - name: Run read-only checks
        run: python3 scripts/appsec_preventive_check.py
